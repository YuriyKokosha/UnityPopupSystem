name: Tests

# Runs both test suites on every push and pull request. Both, not just EditMode:
# PopupSystem.Tests.PlayMode exercises the real WindowsManager/WindowFactory against real prefabs
# on a real canvas, which is exactly the coverage that cannot be reproduced in EditMode - so a CI
# that skipped it would be green while the part most likely to break stayed unwatched.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    strategy:
      # Do not stop the PlayMode job because EditMode failed (or the reverse): when both break,
      # seeing both failures in one run is worth more than finishing a few minutes earlier.
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Unity's Library/ is expensive to rebuild - a cold run reimports every asset in the project.
      # Keyed per test mode so the two jobs do not fight over one cache entry.
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      - name: Run ${{ matrix.testMode }} tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          # Required: a personal or professional Unity licence. Add these under
          # Settings -> Secrets and variables -> Actions. See
          # https://game-ci.github.io/docs/github/activation for how to produce UNITY_LICENSE.
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # Pinned deliberately: this project is on 6000.3.12f1 and a silent editor upgrade in CI
          # is a bad way to find out about an API change.
          unityVersion: 6000.3.12f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} results

      - uses: actions/upload-artifact@v4
        # Upload results even when the tests failed - that is precisely when the NUnit XML is
        # worth reading.
        if: always()
        with:
          name: ${{ matrix.testMode }}-results
          path: ${{ steps.tests.outputs.artifactsPath }}
